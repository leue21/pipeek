name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - name: Build binaries
        run: |
          set -eu
          mkdir -p dist
          build() {
            CGO_ENABLED=0 GOOS=linux GOARCH="$1" GOARM="${2:-}" \
              go build -trimpath -ldflags='-s -w' -o "dist/pipeek-linux-$3" .
          }
          build arm64 "" arm64
          build arm 7 armv7
          build arm 6 armv6
          build amd64 "" amd64
          cd dist && sha256sum pipeek-* > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
