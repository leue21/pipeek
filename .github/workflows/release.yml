# Publishes a tagged release: a tar.gz per architecture and SHA256SUMS,
# attached to the tag's GitHub release. A tag push is the whole of publishing.
name: Release

on:
  push:
    tags: ['v*']
  # Re-publish a tag that was already pushed, without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test

  binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: scripts/build-release.sh "$TAG" dist

      - name: Attach to the release
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "PiPeek $TAG" --generate-notes --verify-tag
          fi
          # --clobber so re-running for a tag replaces the files rather than
          # failing on names already taken.
          gh release upload "$TAG" dist/* --clobber
